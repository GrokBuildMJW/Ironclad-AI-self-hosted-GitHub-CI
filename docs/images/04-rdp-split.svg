<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="t4 d4">
  <title id="t4">RDP split: Windows operator PC connects to the ThinkCentre Tiny</title>
  <desc id="d4">Arrow goes from the Windows operator PC to the ThinkCentre Tiny. Code lives on Linux. GitHub Actions never runs on either of these two machines.</desc>
  <defs>
    <marker id="rdparr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3ee0c5"/>
    </marker>
  </defs>
  <rect width="1100" height="520" fill="#0b0f14"/>
  <text x="40" y="44" fill="#e8eef4" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700">Extreme split: Windows is a monitor</text>
  <text x="40" y="70" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">You sit at Windows. You connect into the ThinkCentre Tiny. The repo never lives on Windows. CI never lives on the Tiny.</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="40" y="100" rx="16" width="420" height="280" fill="#1a2330" stroke="#f0a04b" stroke-width="2"/>
    <text x="64" y="136" fill="#f0a04b" font-size="12" letter-spacing="1.2">OPERATOR · WINDOWS</text>
    <text x="64" y="176" fill="#e8eef4" font-size="22" font-weight="700">Your Windows PC</text>
    <text x="64" y="210" fill="#b7c4d2" font-size="15">mstsc starts here</text>
    <text x="64" y="242" fill="#8b9aab" font-size="14">GNOME Remote Login on Ubuntu.</text>
    <text x="64" y="264" fill="#8b9aab" font-size="14">First prompt: the device user.</text>
    <text x="64" y="286" fill="#8b9aab" font-size="14">Then GDM: the Linux account.</text>
    <text x="64" y="320" fill="#8b9aab" font-size="14">No GitHub runner here.</text>
    <text x="64" y="342" fill="#8b9aab" font-size="14">No product checkout required here.</text>

    <rect x="640" y="100" rx="16" width="420" height="280" fill="#1a2330" stroke="#f0a04b" stroke-width="2"/>
    <text x="664" y="136" fill="#f0a04b" font-size="12" letter-spacing="1.2">DEV WORKSTATION · LINUX</text>
    <text x="664" y="176" fill="#e8eef4" font-size="22" font-weight="700">devbox</text>
    <text x="664" y="210" fill="#b7c4d2" font-size="15">ThinkCentre Tiny · Ubuntu Desktop</text>
    <text x="664" y="242" fill="#8b9aab" font-size="14">Cursor, git, uv, Docker for you.</text>
    <text x="664" y="264" fill="#8b9aab" font-size="14">AppArmor stays on. Do not copy</text>
    <text x="664" y="286" fill="#8b9aab" font-size="14">the runner kernel pin onto this box.</text>
    <text x="664" y="320" fill="#8b9aab" font-size="14">git push origin  from here.</text>
    <text x="664" y="342" fill="#8b9aab" font-size="14">Never install actions.runner.* here.</text>
  </g>

  <line x1="480" y1="240" x2="620" y2="240" stroke="#3ee0c5" stroke-width="4" marker-end="url(#rdparr)"/>
  <text x="550" y="218" text-anchor="middle" fill="#3ee0c5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">RDP →</text>
  <text x="550" y="268" text-anchor="middle" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Windows connects in</text>

  <rect x="40" y="406" rx="12" width="1020" height="84" fill="#151c24" stroke="#2a3544"/>
  <text x="60" y="440" fill="#e8eef4" font-family="Segoe UI, system-ui, sans-serif" font-size="15">Why this is the point: a crashed CI job cannot eat the editor. A Windows update cannot eat the Linux toolchain. A GitHub runner cannot write into the tree you are typing in.</text>
  <text x="60" y="466" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">VNC is not the path. xrdp is fallback only. Daily driver is Cursor on the ThinkCentre Tiny, viewed with the Windows Remote Desktop client.</text>
</svg>
